<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo con esquinas redondeadas (estilo App Icon) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Mini Rejilla de Sudoku táctica de fondo -->
  <g opacity="0.35" transform="translate(96, 96)">
    <!-- Marco -->
    <rect width="320" height="320" rx="16" fill="url(#gridGrad)" stroke="#38bdf8" stroke-width="3" />
    
    <!-- Líneas 3x3 principales gruesas -->
    <line x1="106.6" y1="0" x2="106.6" y2="320" stroke="#38bdf8" stroke-width="4" />
    <line x1="213.3" y1="0" x2="213.3" y2="320" stroke="#38bdf8" stroke-width="4" />
    <line x1="0" y1="106.6" x2="320" y2="106.6" stroke="#38bdf8" stroke-width="4" />
    <line x1="0" y1="213.3" x2="320" y2="213.3" stroke="#38bdf8" stroke-width="4" />

    <!-- Números sutiles de sudoku -->
    <text x="53" y="68" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="bold" fill="#60a5fa" text-anchor="middle">5</text>
    <text x="160" y="175" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="bold" fill="#f59e0b" text-anchor="middle">9</text>
    <text x="266" y="280" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="bold" fill="#34d399" text-anchor="middle">3</text>
  </g>

  <!-- Rayo central de Arena y Competición con resplandor -->
  <path d="M280 60 L140 280 L250 280 L220 460 L380 230 L260 230 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)" />
</svg>